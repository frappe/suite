name: Suite CI

on:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches:
      - develop
    paths:
      - "suite/**"
      - "frontend/**"
      - "realtime/**"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/suite-ci.yml"
  pull_request:
    paths:
      - "suite/**"
      - "frontend/**"
      - "realtime/**"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/suite-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    name: Backend

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check node server changes
        id: node-server-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_sheets=1
            run_meet=1
            run_recorder=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/sheets/collab-server/|\.github/workflows/suite-ci\.yml)' && run_sheets=1 || run_sheets=0
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/meet/sfu-server/|suite/meet/types/|\.github/workflows/suite-ci\.yml)' && run_meet=1 || run_meet=0
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/meet/recorder-server/|suite/meet/types/|\.github/workflows/suite-ci\.yml)' && run_recorder=1 || run_recorder=0
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD)"
            else
              changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            fi
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/sheets/collab-server/|\.github/workflows/suite-ci\.yml)' && run_sheets=1 || run_sheets=0
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/meet/sfu-server/|suite/meet/types/|\.github/workflows/suite-ci\.yml)' && run_meet=1 || run_meet=0
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/meet/recorder-server/|suite/meet/types/|\.github/workflows/suite-ci\.yml)' && run_recorder=1 || run_recorder=0
          fi

          echo "run_sheets=$run_sheets" >> $GITHUB_OUTPUT
          echo "run_meet=$run_meet" >> $GITHUB_OUTPUT
          echo "run_recorder=$run_recorder" >> $GITHUB_OUTPUT
          echo "Run sheets collab server tests: $run_sheets"
          echo "Run meet sfu server tests: $run_meet"
          echo "Run meet recorder server tests: $run_recorder"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Run Realtime Handler Tests
        run: |
          mkdir -p test-results/realtime
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/realtime/junit.xml \
            'realtime/*.test.js'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        run: |
          pip install frappe-bench "unittest-xml-reporting~=4.0"
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Suite
        id: install-suite
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app suite $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app suite
          bench build
        env:
          CI: "Yes"

      - name: Run Backend Tests
        working-directory: /home/runner/frappe-bench
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/backend"
          bench --site test_site set-config allow_tests true
          status=0
          bench --site test_site run-tests --app suite --coverage --junit-xml-output "$GITHUB_WORKSPACE/test-results/backend/junit-fragments.xml" || status=$?
          python "$GITHUB_WORKSPACE/.github/scripts/merge_junit.py" \
            "$GITHUB_WORKSPACE/test-results/backend/junit-fragments.xml" \
            "$GITHUB_WORKSPACE/test-results/backend/junit.xml"
          rm "$GITHUB_WORKSPACE/test-results/backend/junit-fragments.xml"
          exit "$status"
        env:
          TYPE: server

      - name: Check Background Worker
        if: always() && steps.install-suite.outcome == 'success'
        working-directory: /home/runner/frappe-bench
        run: |
          marker=/home/runner/frappe-bench/sites/test_site/private/suite-ci-worker-ready
          rm -f "$marker"
          mkdir -p "$GITHUB_WORKSPACE/test-results/backend"
          bench worker --queue short > "$GITHUB_WORKSPACE/test-results/backend/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          bench --site test_site execute suite.tests.ci_smoke.enqueue_worker_smoke
          timeout 60 bash -c 'until [ -f /home/runner/frappe-bench/sites/test_site/private/suite-ci-worker-ready ]; do sleep 1; done'
          kill "$worker_pid" 2>/dev/null || true
          wait "$worker_pid" 2>/dev/null || true
          trap - EXIT

      - name: Run Sheets Collab Server Tests
        if: always() && steps.node-server-changes.outputs.run_sheets == '1'
        working-directory: suite/sheets/collab-server
        run: |
          npm install
          mkdir -p "$GITHUB_WORKSPACE/test-results/sheets-collab"
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$GITHUB_WORKSPACE/test-results/sheets-collab/junit.xml" \
            'test/**/*.test.js'

      - name: Run Meet SFU Server Tests
        if: always() && steps.node-server-changes.outputs.run_meet == '1'
        working-directory: suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          mkdir -p test-results
          yarn test:ci

      - name: Build Meet Recorder UI
        if: always() && steps.node-server-changes.outputs.run_recorder == '1'
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn workspace @suite/frontend build:recorder

      - name: Run Meet Recorder Server Tests
        if: always() && steps.node-server-changes.outputs.run_recorder == '1'
        working-directory: suite/meet/recorder-server
        run: |
          yarn install --frozen-lockfile
          mkdir -p test-results
          xvfb-run --auto-servernum yarn test:ci
        env:
          RECORDER_CHROMIUM_NO_SANDBOX: "1"

      - name: Run Meet Recorder Integration Tests
        if: always() && github.event_name == 'schedule' && steps.node-server-changes.outputs.run_recorder == '1'
        working-directory: suite/meet/recorder-server
        run: yarn test:integration

      - name: Collect Backend Evidence
        if: always()
        run: |
          if [ -f /home/runner/frappe-bench/coverage.xml ]; then
            cp /home/runner/frappe-bench/coverage.xml test-results/backend/coverage.xml
          fi

      - name: Upload Backend Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-backend-evidence
          path: |
            test-results/
            suite/meet/sfu-server/test-results/
            suite/meet/recorder-server/test-results/
            suite/meet/recorder-server/integration/output/
          if-no-files-found: warn
          retention-days: 30

  mail-calendar:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}

    # One matrix leg per module; both legs run whenever either module changes,
    # since the calendar tests build on the mail harness and Stalwart accounts.
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: mail
            name: Mail
          - module: calendar
            name: Calendar

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check mail/calendar changes
        id: mail-calendar-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_tests=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/mail/|suite/calendar/|pyproject\.toml|\.github/workflows/suite-ci\.yml)' && run_tests=1 || run_tests=0
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD)"
            else
              changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            fi
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/mail/|suite/calendar/|pyproject\.toml|\.github/workflows/suite-ci\.yml)' && run_tests=1 || run_tests=0
          fi

          echo "run=$run_tests" >> $GITHUB_OUTPUT
          echo "Run mail/calendar tests: $run_tests"

      - name: Start Stalwart
        if: steps.mail-calendar-changes.outputs.run == '1'
        run: |
          # The JMAP session advertises URLs at https://mail.example.test (the bootstrap
          # serverHostname), which must resolve to the local container.
          echo "127.0.0.1 mail.example.test" | sudo tee -a /etc/hosts
          bash $GITHUB_WORKSPACE/suite/mail/tests/docker/start-stalwart.sh
        env:
          STALWART_VERSION: v0.16.16
          STALWART_CLI_VERSION: v1.0.12
          STALWART_ADMIN_USER: admin
          STALWART_ADMIN_PASSWORD: admin

      - name: Setup Python
        if: steps.mail-calendar-changes.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        if: steps.mail-calendar-changes.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        if: steps.mail-calendar-changes.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install MariaDB Client
        if: steps.mail-calendar-changes.outputs.run == '1'
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        if: steps.mail-calendar-changes.outputs.run == '1'
        run: |
          pip install frappe-bench "unittest-xml-reporting~=4.0"
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Suite
        if: steps.mail-calendar-changes.outputs.run == '1'
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app suite $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app suite
        env:
          CI: "Yes"

      - name: Run ${{ matrix.name }} Tests
        if: steps.mail-calendar-changes.outputs.run == '1'
        working-directory: /home/runner/frappe-bench
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/${{ matrix.module }}"
          bench --site test_site set-config allow_tests true
          # Invite/OTP flows send transactional emails; with mute_emails set, frappe
          # builds the queue against a dummy outgoing account and never sends.
          bench --site test_site set-config mute_emails 1
          bench --site test_site set-config mail "{'server_url': 'http://127.0.0.1:8080', 'username': 'admin', 'password': 'admin', 'verify_ssl': 0, 'root_domain_name': 'example.test'}" --parse
          # Mail Settings wins over site_config and its verify_ssl checkbox defaults to on,
          # which would shadow the verify_ssl: 0 above (the container's cert is self-signed).
          bench --site test_site execute frappe.db.set_single_value --args "['Mail Settings', 'verify_ssl', 0]"
          bench --site test_site clear-cache

          status=0
          for path in $GITHUB_WORKSPACE/suite/${{ matrix.module }}/tests/test_*.py; do
            [ -e "$path" ] || continue
            rel="${path#"$GITHUB_WORKSPACE"/}"
            module="$(echo "${rel%.py}" | tr / .)"
            fragments="$GITHUB_WORKSPACE/test-results/${{ matrix.module }}/${module}-fragments.xml"
            junit="$GITHUB_WORKSPACE/test-results/${{ matrix.module }}/${module}.xml"
            echo "::group::$module"
            if ! bench --site test_site run-tests --module "$module" --junit-xml-output "$fragments"; then
              status=1
            fi
            python "$GITHUB_WORKSPACE/.github/scripts/merge_junit.py" "$fragments" "$junit"
            rm "$fragments"
            echo "::endgroup::"
          done
          exit "$status"
        env:
          TYPE: server

      - name: Upload ${{ matrix.name }} Evidence
        if: always() && steps.mail-calendar-changes.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.module }}-evidence
          path: test-results/${{ matrix.module }}/
          if-no-files-found: warn
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    name: Frontend

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check frontend changes
        id: frontend-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_frontend=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            printf '%s\n' "$changed_files" | grep -Eq '^(frontend/|package\.json|yarn\.lock|\.github/workflows/suite-ci\.yml)' && run_frontend=1 || run_frontend=0
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD)"
            else
              changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
            fi
            printf '%s\n' "$changed_files" | grep -Eq '^(frontend/|package\.json|yarn\.lock|\.github/workflows/suite-ci\.yml)' && run_frontend=1 || run_frontend=0
          fi

          echo "run=$run_frontend" >> $GITHUB_OUTPUT
          echo "Run frontend: $run_frontend"

      - name: Setup Node
        if: steps.frontend-changes.outputs.run == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        if: steps.frontend-changes.outputs.run == '1'
        run: yarn install --frozen-lockfile

      - name: Create bench site config
        if: steps.frontend-changes.outputs.run == '1'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../../sites"
          printf '{"default_site":"localhost","webserver_port":8000,"socketio_port":9000}\n' > "$GITHUB_WORKSPACE/../../sites/common_site_config.json"

      - name: Build
        if: steps.frontend-changes.outputs.run == '1'
        run: yarn build

      - name: Test
        if: steps.frontend-changes.outputs.run == '1'
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            mkdir -p test-results
            yarn test:ci
          else
            echo "No frontend test script configured"
          fi

      - name: Upload Frontend Evidence
        if: always() && steps.frontend-changes.outputs.run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: suite-frontend-evidence
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 30
