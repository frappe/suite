name: Suite CI

on: workflow_dispatch

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compare preinstalled tools in both orders
        env:
          IMAGE: ghcr.io/frappe/suite-actions-runner:benchmark-4bbfc24ccecf021e1b7e0c08a926e35d141ff60c
        run: |
          docker pull "$IMAGE"
          frappe_sha="$(git ls-remote https://github.com/frappe/frappe.git refs/heads/develop | cut -f1)"
          test -n "$frappe_sha"
          for mode in bench pilot pilot bench; do
            docker run --rm --network host --cpus 2 --add-host unified.test:127.0.0.1 \
              -v "$GITHUB_WORKSPACE:/source:ro" "$IMAGE" \
              bash /source/.github/arc/runner/compare-preinstalled.sh "$mode" "$frappe_sha"
          done
