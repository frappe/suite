name: Suite CI

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    name: Backend
    # One bench and test site serve the backend, mail and calendar tests. Setting
    # them up takes most of the job, so splitting the tests across jobs would
    # repeat that work on more runners.
    timeout-minutes: 55

    # Pilot runs with --ci, so it provisions no database server of its own;
    # the bench points at this container instead (see Setup Pilot).
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changes
        id: changes
        run: |
          # node server suites are exercised by the node-servers job; changes
          # confined to them do not need the bench
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_backend=1
            run_mail_calendar=1
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            else
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                changed_files="$(git diff --name-only HEAD~1 HEAD)"
              else
                changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
              fi
            fi
            backend_paths="$(printf '%s\n' "$changed_files" \
              | grep -Ev '^(suite/meet/sfu-server/|suite/meet/recorder-server/|suite/meet/types/)' \
              | grep -E '^(suite/|pyproject\.toml|\.coveragerc$|\.github/scripts/|\.github/workflows/suite-ci\.yml)' || true)"
            [ -n "$backend_paths" ] && run_backend=1 || run_backend=0
            # Mail and calendar tests run together whenever either module changes,
            # since the calendar tests build on the mail harness and Stalwart accounts.
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/mail/|suite/calendar/|pyproject\.toml|\.github/scripts/|\.github/workflows/suite-ci\.yml)' && run_mail_calendar=1 || run_mail_calendar=0
          fi

          if [ "$run_backend" = 1 ] || [ "$run_mail_calendar" = 1 ]; then run_bench=1; else run_bench=0; fi
          echo "backend=$run_backend" >> $GITHUB_OUTPUT
          echo "mail-calendar=$run_mail_calendar" >> $GITHUB_OUTPUT
          echo "bench=$run_bench" >> $GITHUB_OUTPUT
          echo "Run backend tests: $run_backend"
          echo "Run mail/calendar tests: $run_mail_calendar"

      - name: Setup Python
        if: steps.changes.outputs.bench == '1'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        if: steps.changes.outputs.bench == '1'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        if: steps.changes.outputs.bench == '1'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Pilot
        if: steps.changes.outputs.bench == '1'
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch develop
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password root
          pilot -b frappe-bench init --skip-frontend
          # The external MariaDB service has no utf8mb4 defaults; Frappe needs them.
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL innodb_snapshot_isolation = OFF"

      - name: Install Suite
        id: install-suite
        if: steps.changes.outputs.bench == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
        env:
          CI: "Yes"

      - name: Setup pnpm
        if: steps.changes.outputs.backend == '1'
        uses: pnpm/action-setup@v6

      - name: Build backend content bundles
        if: steps.changes.outputs.backend == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench/apps/suite
        run: |
          # Pilot clones the app with --skip-assets; tests use this clone, not the Actions checkout.
          pnpm install --frozen-lockfile
          pnpm exec vite build --config vite.checker.config.ts
          pnpm exec vite build --config vite.checker.config.ts --mode converter
          pnpm exec vite build --config vite.sheets-checker.config.ts
          pnpm exec vite build --config vite.sheets-checker.config.ts --mode converter
          pnpm exec vite build --config vite.slides-checker.config.ts
          pnpm exec vite build --config vite.slides-checker.config.ts --mode converter

      - name: Start Pilot
        id: start-pilot
        if: steps.changes.outputs.bench == '1'
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Benchmark coverage
        working-directory: /home/runner/pilot/benches/frappe-bench
        env:
          TYPE: server
          COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc
        run: |
          git -C apps/frappe rev-parse HEAD
          ./env/bin/python -m coverage --version
          output="$GITHUB_WORKSPACE/test-results"
          mkdir -p "$output"
          printf 'trial,mode,wall_seconds,status\n' > "$output/timing.csv"

          # Change only the disposable bench copy for the exclusion experiment.
          python - <<'PYTHON'
          from pathlib import Path
          path = Path("apps/frappe/frappe/coverage.py")
          source = path.read_text()
          marker = "omit = STANDARD_EXCLUSIONS[:]"
          assert source.count(marker) == 1
          path.write_text(source.replace(marker, marker + '\n\t\t\tif os.getenv("SUITE_BENCH_OMIT_TESTS") == "1":\n\t\t\t\tomit.extend(["*/tests/*", "*/test_*.py"])'))
          PYTHON

          trial=0
          failed=0
          for mode in off on excluded excluded on off; do
            trial=$((trial + 1))
            site="bench-$trial.localhost"
            pilot new-site "$site" --admin-password admin --apps frappe suite --skip-assets
            pilot frappe --site "$site" set-config allow_tests true

            args=()
            omit=0
            if [ "$mode" != off ]; then args+=(--coverage); fi
            if [ "$mode" = excluded ]; then omit=1; fi
            status=0
            /usr/bin/time -f '%e' -o "$output/$trial.time" \
              env SUITE_BENCH_OMIT_TESTS="$omit" COVERAGE_DEBUG=sys COVERAGE_DEBUG_FILE="$output/$trial.coverage-debug" \
              pilot frappe --site "$site" run-tests --app suite \
                --module suite.writer.content.tests.test_conversion "${args[@]}" \
                --junit-xml-output "$output/$trial.junit-fragments.xml" || status=$?
            printf '%s,%s,%s,%s\n' "$trial" "$mode" "$(cat "$output/$trial.time")" "$status" | tee -a "$output/timing.csv"
            if [ "$mode" != off ] && [ "$status" = 0 ]; then
              cp sites/coverage.xml "$output/$trial.coverage.xml"
            fi
            if [ "$status" != 0 ]; then failed=1; fi
          done
          cat "$output/timing.csv" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-coverage-benchmark
          path: test-results/
