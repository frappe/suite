name: Suite CI

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    name: Backend
    # One bench and test site serve the backend, mail and calendar tests. Setting
    # them up takes most of the job, so splitting the tests across jobs would
    # repeat that work on more runners.
    timeout-minutes: 30

    # Pilot runs with --ci, so it provisions no database server of its own;
    # the bench points at this container instead (see Setup Pilot).
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changes
        id: changes
        run: |
          # node server suites are exercised by the node-servers job; changes
          # confined to them do not need the bench
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            run_backend=1
            run_mail_calendar=1
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
            else
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                changed_files="$(git diff --name-only HEAD~1 HEAD)"
              else
                changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
              fi
            fi
            backend_paths="$(printf '%s\n' "$changed_files" \
              | grep -Ev '^(suite/meet/sfu-server/|suite/meet/recorder-server/|suite/meet/types/)' \
              | grep -E '^(suite/|pyproject\.toml|\.coveragerc$|\.github/scripts/|\.github/workflows/suite-ci\.yml)' || true)"
            [ -n "$backend_paths" ] && run_backend=1 || run_backend=0
            # Mail and calendar tests run together whenever either module changes,
            # since the calendar tests build on the mail harness and Stalwart accounts.
            printf '%s\n' "$changed_files" | grep -Eq '^(suite/mail/|suite/calendar/|pyproject\.toml|\.github/scripts/|\.github/workflows/suite-ci\.yml)' && run_mail_calendar=1 || run_mail_calendar=0
          fi

          if [ "$run_backend" = 1 ] || [ "$run_mail_calendar" = 1 ]; then run_bench=1; else run_bench=0; fi
          echo "backend=$run_backend" >> $GITHUB_OUTPUT
          echo "mail-calendar=$run_mail_calendar" >> $GITHUB_OUTPUT
          echo "bench=$run_bench" >> $GITHUB_OUTPUT
          echo "Run backend tests: $run_backend"
          echo "Run mail/calendar tests: $run_mail_calendar"

      - name: Start Stalwart
        if: steps.changes.outputs.mail-calendar == '1'
        run: |
          # The JMAP session advertises URLs at https://mail.example.test (the bootstrap
          # serverHostname), which must resolve to the local container.
          echo "127.0.0.1 mail.example.test" | sudo tee -a /etc/hosts
          bash $GITHUB_WORKSPACE/suite/mail/tests/docker/start-stalwart.sh
        env:
          STALWART_VERSION: v0.16.20
          STALWART_CLI_VERSION: v1.0.12
          STALWART_ADMIN_USER: admin
          STALWART_ADMIN_PASSWORD: admin

      - name: Setup Python
        if: steps.changes.outputs.bench == '1'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup Node
        if: steps.changes.outputs.bench == '1'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        if: steps.changes.outputs.bench == '1'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Pilot
        if: steps.changes.outputs.bench == '1'
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch develop
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password root
          pilot -b frappe-bench init --skip-frontend
          # The external MariaDB service has no utf8mb4 defaults; Frappe needs them.
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL innodb_snapshot_isolation = OFF"

      - name: Install Suite
        id: install-suite
        if: steps.changes.outputs.bench == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
        env:
          CI: "Yes"

      - name: Setup pnpm
        if: steps.changes.outputs.backend == '1'
        uses: pnpm/action-setup@v6

      - name: Build backend content bundles
        if: steps.changes.outputs.backend == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench/apps/suite
        run: |
          # Pilot clones the app with --skip-assets; tests use this clone, not the Actions checkout.
          pnpm install --frozen-lockfile
          pnpm exec vite build --config vite.checker.config.ts
          pnpm exec vite build --config vite.checker.config.ts --mode converter
          pnpm exec vite build --config vite.sheets-checker.config.ts
          pnpm exec vite build --config vite.sheets-checker.config.ts --mode converter
          pnpm exec vite build --config vite.slides-checker.config.ts
          pnpm exec vite build --config vite.slides-checker.config.ts --mode converter

      - name: Start Pilot
        id: start-pilot
        if: steps.changes.outputs.bench == '1'
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Create Test Site
        id: create-site
        if: steps.changes.outputs.bench == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site test_site --admin-password admin --apps frappe suite --skip-assets
          pilot frappe --site test_site set-config allow_tests true

      - name: Check HTTP contract
        if: steps.changes.outputs.backend == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          # The route tables export to contract.json. The frontend job checks
          # that generated.ts matches contract.json; this step checks that
          # contract.json matches the Python route tables.
          pilot frappe --site test_site execute suite.composition.contract.write_all
          git -C apps/suite diff --exit-code --stat -- ':(glob)frontend/src/**/contract.json'

      - name: Type-check Python
        if: steps.changes.outputs.backend == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench/apps/suite
        run: |
          pip install "mypy~=2.4"
          mypy

      - name: Run Backend Tests
        if: steps.changes.outputs.backend == '1'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/backend"
          pilot frappe --site test_site set-config allow_tests true
          # Frappe refuses a new User once 60 were created in the last hour.
          # The suite creates more than that, so the later modules would fail.
          pilot frappe --site test_site set-config throttle_user_limit 1000 --parse
          status=0
          pilot frappe --site test_site run-tests --app suite --junit-xml-output "$GITHUB_WORKSPACE/test-results/backend/junit-fragments.xml" || status=$?
          python "$GITHUB_WORKSPACE/.github/scripts/merge_junit.py" \
            "$GITHUB_WORKSPACE/test-results/backend/junit-fragments.xml" \
            "$GITHUB_WORKSPACE/test-results/backend/junit.xml"
          rm "$GITHUB_WORKSPACE/test-results/backend/junit-fragments.xml"
          exit "$status"
        env:
          TYPE: server

      - name: Compare Collab Compaction With Yjs
        if: always() && steps.changes.outputs.backend == '1' && steps.install-suite.outcome == 'success'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          ./env/bin/python apps/suite/suite/content/tests/differential/compact.py "$RUNNER_TEMP/compacted.json"
          node apps/suite/suite/content/tests/differential/judge.cjs "$RUNNER_TEMP/compacted.json"

      - name: Check Background Worker
        if: always() && steps.changes.outputs.backend == '1' && steps.install-suite.outcome == 'success'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          marker=/home/runner/pilot/benches/frappe-bench/sites/test_site/private/suite-ci-worker-ready
          rm -f "$marker"
          mkdir -p "$GITHUB_WORKSPACE/test-results/backend"
          pilot frappe --site test_site execute suite.tests.ci_smoke.enqueue_worker_smoke
          timeout 60 bash -c 'until [ -f /home/runner/pilot/benches/frappe-bench/sites/test_site/private/suite-ci-worker-ready ]; do sleep 1; done'

      # Last, since it swaps Node for the oldest one the converter supports (suite/content/convert.py NODE_MIN)
      - name: Setup Node 22.13
        if: always() && steps.changes.outputs.backend == '1' && steps.install-suite.outcome == 'success'
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Run Converter Tests On Node 22.13
        if: always() && steps.changes.outputs.backend == '1' && steps.install-suite.outcome == 'success'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          test "$(node --version)" = v22.13.0
          pilot frappe --site test_site run-tests --module suite.writer.content.tests.test_converter
      # Connecting the site to Stalwart comes after the backend tests, so that run
      # still skips the tests that need a mail server, as it did on its own.
      - name: Connect Site to Stalwart
        id: connect-stalwart
        if: ${{ !cancelled() && steps.changes.outputs.mail-calendar == '1' && steps.create-site.outcome == 'success' }}
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          # Invite/OTP flows send transactional emails; with mute_emails set, frappe
          # builds the queue against a dummy outgoing account and never sends.
          pilot frappe --site test_site set-config mute_emails 1
          pilot frappe --site test_site set-config mail "{'server_url': 'http://127.0.0.1:8080', 'username': 'admin', 'password': 'admin', 'verify_ssl': 0}" --parse
          # Mail Settings wins over site_config and its verify_ssl checkbox defaults to on,
          # which would shadow the verify_ssl: 0 above (the container's cert is self-signed).
          pilot frappe --site test_site execute frappe.db.set_single_value --args "['Mail Settings', 'verify_ssl', 0]"
          pilot frappe --site test_site clear-cache

      - name: Run Mail Tests
        if: ${{ !cancelled() && steps.connect-stalwart.outcome == 'success' }}
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_module_tests.sh" mail
        env:
          TYPE: server

      - name: Run Calendar Tests
        if: ${{ !cancelled() && steps.connect-stalwart.outcome == 'success' }}
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run_module_tests.sh" calendar
        env:
          TYPE: server

      - name: Collect Pilot Logs
        if: always() && steps.start-pilot.outcome == 'success'
        run: |
          mkdir -p test-results
          cp "$RUNNER_TEMP/pilot.log" test-results/pilot.log

      - name: Upload Evidence
        if: always() && steps.changes.outputs.bench == '1'
        uses: actions/upload-artifact@v7
        with:
          name: suite-backend-evidence
          path: |
            test-results/
          if-no-files-found: warn
          retention-days: 30
