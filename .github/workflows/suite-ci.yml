name: Compare Studio and Flow builds

on: workflow_dispatch

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: BreadGenie/frappe
          ref: ae0327265dd40c3aa855d21fbfff50405dc047e3
          path: bench/apps/frappe
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prepare build-only bench and dependencies
        run: |
          mkdir -p bench/sites/assets
          printf 'frappe\n' > bench/sites/apps.txt
          echo '{"webserver_port":8000,"socketio_port":9000}' > bench/sites/common_site_config.json
          ln -s "$PWD/bench/apps/frappe/frappe/public" bench/sites/assets/frappe
          yarn --cwd bench/apps/frappe install --frozen-lockfile
          ln -s "$PWD/bench/apps/frappe/node_modules" bench/apps/frappe/frappe/public/node_modules
          yarn --cwd bench/apps/frappe/studio/frontend install --frozen-lockfile
          yarn --cwd bench/apps/frappe/flow install --frozen-lockfile
          python -m pip install psutil
      - name: Benchmark sequential and default concurrency
        run: python .github/scripts/benchmark-framework-frontends.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parallel-frontends-benchmark
          path: benchmark-results/
          retention-days: 7
