name: Sheets CI

on:
  push:
    branches:
      - develop
    paths:
      - "suite/sheets/**"
      - "frontend/src/apps/sheets/**"
      - "pyproject.toml"
      - ".github/workflows/sheets-ci.yml"
      - ".github/workflows/suite-module-ci.yml"
  pull_request:
    paths:
      - "suite/sheets/**"
      - "frontend/src/apps/sheets/**"
      - "pyproject.toml"
      - ".github/workflows/sheets-ci.yml"
      - ".github/workflows/suite-module-ci.yml"
  workflow_dispatch:

concurrency:
  group: sheets-ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-frontend:
    uses: ./.github/workflows/suite-module-ci.yml
    with:
      module: suite.sheets
      test-path: suite/sheets
      extra-backend-working-directory: suite/sheets/collab-server
      extra-backend-install-command: npm install
      extra-backend-test-command: npm test
