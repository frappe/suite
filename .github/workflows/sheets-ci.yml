name: Sheets CI

on:
  push:
    branches:
      - develop
    paths:
      - "suite/sheets/**"
      - "frontend/src/apps/sheets/**"
      - "pyproject.toml"
      - ".github/workflows/sheets-ci.yml"
      - ".github/workflows/suite-module-ci.yml"
  pull_request:
    paths:
      - "suite/sheets/**"
      - "frontend/src/apps/sheets/**"
      - "pyproject.toml"
      - ".github/workflows/sheets-ci.yml"
      - ".github/workflows/suite-module-ci.yml"
  workflow_dispatch:

concurrency:
  group: sheets-ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    uses: ./.github/workflows/suite-module-ci.yml
    with:
      module: suite.sheets
      test-path: suite/sheets

  collab-server:
    runs-on: ubuntu-latest
    name: Collab Server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: suite/sheets/collab-server
        run: npm install

      - name: Test
        working-directory: suite/sheets/collab-server
        run: npm test
