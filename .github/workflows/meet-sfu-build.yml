name: Build and Push Meet SFU Image

on:
  push:
    branches:
      - develop
    paths:
      - "suite/meet/sfu-server/**"
      - "suite/meet/types/**"
      - ".github/workflows/meet-sfu-build.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: frappe/suite/meet-sfu-server

jobs:
  build-and-push:
    strategy:
      matrix:
        cache-mode: [min, max]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate an SFU source change (trial only)
        run: echo '// SFU cache source-change trial, round 1' >> suite/meet/sfu-server/src/server.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=source-cache-trial-${{ matrix.cache-mode }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: suite/meet
          file: suite/meet/sfu-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=sfu-source-trial-${{ matrix.cache-mode }}
            type=gha
          cache-to: type=gha,scope=sfu-source-trial-${{ matrix.cache-mode }},mode=${{ matrix.cache-mode }}
