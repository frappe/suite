name: Build ARC Runner Image

on:
  push:
    branches:
      - develop
    paths:
      - ".github/arc/runner/Dockerfile"
      - ".github/arc/runner/Dockerfile.dockerignore"
      - ".github/workflows/arc-runner-image.yml"
      - "package.json"
      - "yarn.lock"
      - "frontend/package.json"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "suite/meet/sfu-server/package.json"
      - "suite/meet/sfu-server/yarn.lock"
  pull_request:
    paths:
      - ".github/arc/runner/Dockerfile"
      - ".github/arc/runner/Dockerfile.dockerignore"
      - ".github/workflows/arc-runner-image.yml"
      - "package.json"
      - "yarn.lock"
      - "frontend/package.json"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "suite/meet/sfu-server/package.json"
      - "suite/meet/sfu-server/yarn.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/arc/runner/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/frappe/suite-actions-runner:2.336.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/arc/runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/frappe/suite-actions-runner:2.336.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
