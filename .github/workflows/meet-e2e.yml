name: Meet E2E Tests

on:
  workflow_dispatch:
    inputs:
      check_scheduler:
        description: Exercise the scheduled job smoke check
        type: boolean
        default: true

jobs:
  e2e:
    runs-on: suite-e2e-meet
    name: E2E Tests
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      SITE: meet.test

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"

      - name: Setup Yarn
        # Frappe and the e2e package use Yarn 1. Frappe builds Suite with pnpm.
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Add to Hosts
        run: echo "127.0.0.1 meet.test" | sudo tee -a /etc/hosts

      - name: Set up Pilot
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch develop
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password root
          pilot -b frappe-bench set-bench-config watch_apps_js false
          pilot -b frappe-bench set-bench-config lite_mode_enabled false
          pilot -b frappe-bench set-bench-config reload_python false
          pilot -b frappe-bench init
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'; SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install and build Suite
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
          pilot build --app suite
        env:
          CI: "Yes"

      - name: Start Pilot
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:7000/api/v1/health

      - name: Configure Site for E2E
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site "$SITE" --admin-password admin --apps frappe suite --skip-assets
          pilot frappe --site meet.test set-config sfu_secret "e2e-test-secret-key-12345"
          pilot frappe --site meet.test set-config sfu_server_url "http://localhost"
          pilot frappe --site meet.test set-config sfu_server_port "3000"
          pilot frappe --site meet.test set-config ignore_csrf 1
          pilot frappe --site meet.test set-config allow_tests true
          pilot frappe --site meet.test set-config host_name "http://meet.test:8000"
          if [ "${{ inputs.check_scheduler }}" = "true" ]; then
            pilot frappe set-config -g scheduler_tick_interval 5
            pilot frappe --site meet.test enable-scheduler
            pilot frappe --site meet.test execute suite.tests.ci_smoke.enable_scheduler_smoke_logging
          else
            pilot frappe --site "$SITE" disable-scheduler
          fi
          pilot frappe --site meet.test clear-cache

      - name: Build SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Install E2E Dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          google-chrome --version

      - name: Wait for the test site
        id: start-frappe
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            "http://$SITE:8000/api/method/ping"

      - name: Start SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn start &
          echo "Waiting for SFU server..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "SFU server is ready"
        env:
          NODE_ENV: development
          PORT: 3000
          HOST: 0.0.0.0
          JWT_SECRET: e2e-test-secret-key-12345
          WEBRTC_LISTEN_IP: 0.0.0.0
          WEBRTC_ANNOUNCED_IP: ""
          MEDIASOUP_NUM_WORKERS: 1
          SOCKET_PING_INTERVAL: 1000
          SOCKET_PING_TIMEOUT: 3000

      - name: Run E2E Tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:meet
        env:
          BASE_URL: http://meet.test:8000
          SFU_URL: http://localhost:3000
          CI: true
          SFU_E2E_DISCONNECT_TEST: true
          SFU_E2E_DISCONNECT_WAIT_MS: 7000

      - name: Check Scheduled Job Execution
        if: always() && inputs.check_scheduler && steps.start-frappe.outcome == 'success'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: timeout 90 bash -c 'until [ "$(pilot frappe --site meet.test execute suite.tests.ci_smoke.scheduler_smoke_ran)" = "true" ]; do sleep 5; done'

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && !cancelled()
        with:
          name: meet-playwright-report
          path: |
            e2e/meet/playwright-report/
            e2e/meet/test-results/
            e2e/meet/results.xml
            ${{ runner.temp }}/pilot.log
          compression-level: 1
          retention-days: 14

      - name: Upload JUnit Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: meet-junit
          path: e2e/meet/results.xml
          if-no-files-found: warn
          retention-days: 14
