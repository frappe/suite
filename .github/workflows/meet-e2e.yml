name: Meet E2E Tests

on:
  schedule:
    - cron: "7 2 * * *"
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/meet/**"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "realtime/**"
      - "e2e/meet/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  pull_request:
    paths:
      - "suite/meet/**"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "realtime/**"
      - "e2e/meet/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Playwright --shard=N/M splits the suite; each job is self-contained.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    name: E2E Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 meet.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache bench directory
        id: cache-bench
        uses: actions/cache@v4
        with:
          path: ~/frappe-bench
          key: ${{ runner.os }}-bench-${{ hashFiles('**/pyproject.toml', '**/yarn.lock', '**/requirements.txt', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        run: |
          pip install frappe-bench
          if [ "${{ steps.cache-bench.outputs.cache-hit }}" != "true" ]; then
            bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          fi

      - name: Install Suite
        working-directory: /home/runner/frappe-bench
        run: |
          rm -rf apps/suite sites/meet.test sites/assets/suite
          bench get-app suite $GITHUB_WORKSPACE
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site --db-root-password root --admin-password admin meet.test
          bench --site meet.test install-app suite
          cd apps/suite
          yarn install --frozen-lockfile --non-interactive
          yarn build
          cd /home/runner/frappe-bench
          bench build
        env:
          CI: "Yes"

      - name: Configure Site for E2E
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site meet.test set-config sfu_secret "e2e-test-secret-key-12345"
          bench --site meet.test set-config sfu_server_url "http://localhost"
          bench --site meet.test set-config sfu_server_port "3000"
          bench --site meet.test set-config ignore_csrf 1
          bench --site meet.test set-config allow_tests true
          bench --site meet.test set-config host_name "http://meet.test:8000"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bench set-config -g scheduler_tick_interval 5
            bench --site meet.test enable-scheduler
            bench --site meet.test execute suite.tests.ci_smoke.enable_scheduler_smoke_logging
          fi

      - name: Build SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Install E2E Dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn playwright install-deps chromium
          google-chrome --version

      - name: Start Frappe Server
        id: start-frappe
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          if [ "${{ github.event_name }}" != "schedule" ]; then
            sed -i 's/^schedule:/# schedule:/g' Procfile
          fi
          bench start &> bench_start.log &
          echo "Waiting for Frappe server to start..."
          timeout 60 bash -c 'until curl -s http://meet.test:8000 > /dev/null; do sleep 2; done'
          echo "Frappe server is ready!"

      - name: Start SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn start &
          echo "Waiting for SFU server..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "SFU server is ready"
        env:
          PORT: 3000
          HOST: 0.0.0.0
          JWT_SECRET: e2e-test-secret-key-12345
          WEBRTC_LISTEN_IP: 127.0.0.1
          WEBRTC_ANNOUNCED_IP: 127.0.0.1
          MEDIASOUP_NUM_WORKERS: 1
          SOCKET_PING_INTERVAL: 1000
          SOCKET_PING_TIMEOUT: 3000

      - name: Run E2E Tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:meet --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: http://meet.test:8000
          SFU_URL: http://localhost:3000
          CI: true
          SFU_E2E_DISCONNECT_TEST: true
          SFU_E2E_DISCONNECT_WAIT_MS: 7000

      - name: Check Scheduled Job Execution
        if: always() && github.event_name == 'schedule' && steps.start-frappe.outcome == 'success'
        working-directory: /home/runner/frappe-bench
        run: timeout 90 bash -c 'until [ "$(bench --site meet.test execute suite.tests.ci_smoke.scheduler_smoke_ran)" = "true" ]; do sleep 5; done'

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: meet-playwright-report-shard-${{ matrix.shardIndex }}
          path: |
            e2e/meet/playwright-report/
            e2e/meet/test-results/
            e2e/meet/results.xml
            /home/runner/frappe-bench/bench_start.log
          compression-level: 1
          retention-days: 30

      - name: Upload JUnit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meet-junit-shard-${{ matrix.shardIndex }}
          path: e2e/meet/results.xml
          if-no-files-found: warn
          retention-days: 30
