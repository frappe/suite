name: Meet E2E Tests

on:
  schedule:
    - cron: "7 2 * * *"
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/meet/**"
      - "suite/api/**"
      - "suite/suite_core/**"
      - "suite/utils/**"
      - "suite/www/suite.py"
      - "suite/calendar/**"
      - "suite/public/meet/**"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "realtime/**"
      - "e2e/meet/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/meet/**"
      - "frontend/src/apps/calendar/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/src/shell/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/shims/**"
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/apps/registry.ts"
      - "frontend/index.html"
      - "frontend/tailwind.config.js"
      - "frontend/postcss.config.js"
      - "frontend/tsconfig.json"
      - "frontend/tsconfig.node.json"
      - "frontend/scripts/copy-noise-suppression-assets.mjs"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  pull_request_target:
    paths:
      - "suite/meet/**"
      - "suite/api/**"
      - "suite/suite_core/**"
      - "suite/utils/**"
      - "suite/www/suite.py"
      - "suite/calendar/**"
      - "suite/public/meet/**"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "realtime/**"
      - "e2e/meet/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/meet/**"
      - "frontend/src/apps/calendar/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/src/shell/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/shims/**"
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/apps/registry.ts"
      - "frontend/index.html"
      - "frontend/tailwind.config.js"
      - "frontend/postcss.config.js"
      - "frontend/tsconfig.json"
      - "frontend/tsconfig.node.json"
      - "frontend/scripts/copy-noise-suppression-assets.mjs"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: suite-e2e-meet
    # Historical durations keep each self-contained group near the same runtime.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    name: E2E Tests (group ${{ matrix.group }})
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"

      - name: Setup Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Add to Hosts
        run: echo "127.0.0.1 meet.test" | sudo tee -a /etc/hosts

      - name: Setup Bench
        run: |
          rm -rf "$RUNNER_TEMP/frappe-bench"
          if [ "$(bench --version 2>/dev/null || true)" != "5.31.0" ]; then
            python -m pip install "frappe-bench==5.31.0"
          fi
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" "$RUNNER_TEMP/frappe-bench"

      - name: Install Suite
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          rm -rf apps/suite sites/meet.test sites/assets/suite
          git clone "$GITHUB_WORKSPACE" apps/suite
          uv pip install --quiet -e "$PWD/apps/suite" --python "$PWD/env/bin/python"
          cache_key=$(cd apps/suite && { node --version; yarn --version; sha256sum package.json yarn.lock frontend/package.json; } | sha256sum | cut -d ' ' -f 1)
          if [ -f /var/cache/suite-node-modules/key ] && [ "$cache_key" = "$(cat /var/cache/suite-node-modules/key)" ]; then
            tar -xzf /var/cache/suite-node-modules/node_modules.tar.gz -C apps/suite
          else
            yarn --cwd apps/suite install --check-files
          fi
          python -c 'from bench.bench import Bench; Bench(".").apps.sync(app_name="suite", app_dir="suite")'
          bench build --app suite
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site --db-root-password root --admin-password admin meet.test
          bench --site meet.test install-app suite
        env:
          CI: "Yes"

      - name: Configure Site for E2E
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          bench --site meet.test set-config sfu_secret "e2e-test-secret-key-12345"
          bench --site meet.test set-config sfu_server_url "http://localhost"
          bench --site meet.test set-config sfu_server_port "3000"
          bench --site meet.test set-config ignore_csrf 1
          bench --site meet.test set-config allow_tests true
          bench --site meet.test set-config host_name "http://meet.test:8000"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bench set-config -g scheduler_tick_interval 5
            bench --site meet.test enable-scheduler
            bench --site meet.test execute suite.tests.ci_smoke.enable_scheduler_smoke_logging
          fi
          bench --site meet.test clear-cache

      - name: Build SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Install E2E Dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          google-chrome --version

      - name: Start Frappe Server
        id: start-frappe
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          if [ "${{ github.event_name }}" != "schedule" ]; then
            sed -i 's/^schedule:/# schedule:/g' Procfile
          fi
          bench start &> bench_start.log &
          echo "Waiting for Frappe server to start..."
          timeout 60 bash -c 'until curl -s http://meet.test:8000 > /dev/null; do sleep 2; done'
          echo "Frappe server is ready!"

      - name: Start SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn start &
          echo "Waiting for SFU server..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "SFU server is ready"
        env:
          PORT: 3000
          HOST: 0.0.0.0
          JWT_SECRET: e2e-test-secret-key-12345
          WEBRTC_LISTEN_IP: 127.0.0.1
          WEBRTC_ANNOUNCED_IP: 127.0.0.1
          MEDIASOUP_NUM_WORKERS: 1
          SOCKET_PING_INTERVAL: 1000
          SOCKET_PING_TIMEOUT: 3000

      - name: Run E2E Tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:meet
        env:
          BASE_URL: http://meet.test:8000
          SFU_URL: http://localhost:3000
          CI: true
          MEET_E2E_GROUP: ${{ matrix.group }}
          SFU_E2E_DISCONNECT_TEST: true
          SFU_E2E_DISCONNECT_WAIT_MS: 7000

      - name: Check Scheduled Job Execution
        if: always() && github.event_name == 'schedule' && steps.start-frappe.outcome == 'success'
        working-directory: ${{ runner.temp }}/frappe-bench
        run: timeout 90 bash -c 'until [ "$(bench --site meet.test execute suite.tests.ci_smoke.scheduler_smoke_ran)" = "true" ]; do sleep 5; done'

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && !cancelled()
        with:
          name: meet-playwright-report-group-${{ matrix.group }}
          path: |
            e2e/meet/playwright-report/
            e2e/meet/test-results/
            e2e/meet/results.xml
            ${{ runner.temp }}/frappe-bench/bench_start.log
          compression-level: 1
          retention-days: 14

      - name: Upload JUnit Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: meet-junit-group-${{ matrix.group }}
          path: e2e/meet/results.xml
          if-no-files-found: warn
          retention-days: 14
