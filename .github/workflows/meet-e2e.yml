name: Meet E2E Tests

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/meet/**"
      - "frontend/src/apps/meet/**"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  pull_request:
    paths:
      - "suite/meet/**"
      - "frontend/src/apps/meet/**"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  workflow_dispatch:

concurrency:
  group: meet-e2e-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build frontend + SFU once; shards only restore artifacts (no yarn/bench rebuild).
  prepare:
    runs-on: ubuntu-latest
    name: Prepare build artifacts
    timeout-minutes: 30

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # frontend/vite.config.ts resolves benchRoot as frontend/../../.. and reads
      # sites/common_site_config.json for __SITE_NAME__ / socketio port. Outside a
      # real bench that path is missing (ENOENT on /home/runner/work/sites/...).
      - name: Stub bench common_site_config for Vite
        run: |
          BENCH_ROOT="$(node -e "console.log(require('path').resolve('frontend', '../../..'))")"
          mkdir -p "$BENCH_ROOT/sites"
          cat > "$BENCH_ROOT/sites/common_site_config.json" <<'EOF'
          {
            "default_site": "meet.test",
            "webserver_port": 8000,
            "socketio_port": 9000
          }
          EOF
          echo "Wrote $BENCH_ROOT/sites/common_site_config.json"
          cat "$BENCH_ROOT/sites/common_site_config.json"

      - name: Build Suite frontend
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn build
        env:
          CI: "Yes"

      - name: Build SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: meet-e2e-frontend
          path: suite/public/frontend/
          retention-days: 1
          compression-level: 6

      - name: Upload SFU dist
        uses: actions/upload-artifact@v4
        with:
          name: meet-e2e-sfu-dist
          path: suite/meet/sfu-server/dist/
          retention-days: 1
          compression-level: 6

  e2e:
    needs: prepare
    runs-on: ubuntu-latest
    # Weight-balanced project shards (see playwright.config.ts).
    # workers stay at 1 inside each shard (multi-worker caused DB deadlocks).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: E2E Tests (shard-${{ matrix.shard }})
    timeout-minutes: 60

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 meet.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache bench directory
        id: cache-bench
        uses: actions/cache@v4
        with:
          path: ~/frappe-bench
          key: ${{ runner.os }}-bench-${{ hashFiles('**/pyproject.toml', '**/yarn.lock', '**/requirements.txt', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        run: |
          pip install frappe-bench
          if [ "${{ steps.cache-bench.outputs.cache-hit }}" != "true" ]; then
            bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          fi

      # get-app without --skip-assets runs: yarn install + `node esbuild --run-build-command`
      # (full vite production build). Prepare already built assets; skip that here.
      - name: Install Suite (no frontend rebuild)
        working-directory: /home/runner/frappe-bench
        run: |
          rm -rf apps/suite sites/meet.test sites/assets/suite
          bench get-app suite $GITHUB_WORKSPACE --skip-assets
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site --db-root-password root --admin-password admin meet.test
          # Python/DB install only — no asset pipeline (get-app already skipped it).
          bench --site meet.test install-app suite
        env:
          CI: "Yes"

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: meet-e2e-frontend
          path: /home/runner/frappe-bench/apps/suite/suite/public/frontend

      - name: Link assets (bench build only)
        working-directory: /home/runner/frappe-bench
        run: |
          test -f apps/suite/suite/public/frontend/index.html
          # Copies app public/ into sites/assets — no yarn/vite rebuild.
          bench build --app suite

      - name: Configure Site for E2E
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site meet.test set-config sfu_secret "e2e-test-secret-key-12345"
          bench --site meet.test set-config sfu_server_url "http://localhost"
          bench --site meet.test set-config sfu_server_port "3000"
          bench --site meet.test set-config ignore_csrf 1
          bench --site meet.test set-config allow_tests true
          bench --site meet.test set-config host_name "http://meet.test:8000"

      - name: Download SFU dist
        uses: actions/download-artifact@v4
        with:
          name: meet-e2e-sfu-dist
          path: ${{ github.workspace }}/suite/meet/sfu-server/dist

      - name: Install SFU runtime deps
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          test -f dist/sfu-server/src/server.js

      - name: Install E2E Dependencies
        working-directory: ${{ github.workspace }}/suite/meet/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn playwright install-deps chromium
          google-chrome --version

      - name: Start Frappe Server
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          sed -i 's/^schedule:/# schedule:/g' Procfile
          bench start &> bench_start.log &
          echo "Waiting for Frappe server to start..."
          timeout 60 bash -c 'until curl -s http://meet.test:8000 > /dev/null; do sleep 2; done'
          echo "Frappe server is ready!"

      - name: Start SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn start &
          echo "Waiting for SFU server..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "SFU server is ready"
        env:
          PORT: 3000
          HOST: 0.0.0.0
          JWT_SECRET: e2e-test-secret-key-12345
          WEBRTC_LISTEN_IP: 127.0.0.1
          WEBRTC_ANNOUNCED_IP: 127.0.0.1
          # One Playwright worker per shard; single mediasoup worker is enough.
          MEDIASOUP_NUM_WORKERS: 1

      - name: Run E2E Tests
        working-directory: ${{ github.workspace }}/suite/meet/e2e
        run: yarn test --project=shard-${{ matrix.shard }}
        env:
          BASE_URL: http://meet.test:8000
          SFU_URL: http://localhost:3000
          CI: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: meet-playwright-report-shard-${{ matrix.shard }}
          path: |
            suite/meet/e2e/playwright-report/
            suite/meet/e2e/test-results/
            suite/meet/e2e/results.xml
          compression-level: 1
          retention-days: 7
