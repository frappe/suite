name: Meet E2E Tests

on:
  schedule:
    - cron: "7 2 * * *"
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/meet/**"
      - "suite/api/**"
      - "suite/suite_core/**"
      - "suite/utils/**"
      - "suite/www/suite.py"
      - "suite/calendar/**"
      - "suite/public/meet/**"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "realtime/**"
      - "e2e/meet/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/meet/**"
      - "frontend/src/apps/calendar/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/src/shell/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/shims/**"
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/apps/registry.ts"
      - "frontend/index.html"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "scripts/copy-noise-suppression-assets.mjs"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  pull_request_target:
    paths:
      - "suite/meet/**"
      - "suite/api/**"
      - "suite/suite_core/**"
      - "suite/utils/**"
      - "suite/www/suite.py"
      - "suite/calendar/**"
      - "suite/public/meet/**"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "realtime/**"
      - "e2e/meet/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/meet/**"
      - "frontend/src/apps/calendar/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/src/shell/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/shims/**"
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/apps/registry.ts"
      - "frontend/index.html"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "scripts/copy-noise-suppression-assets.mjs"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - ".github/workflows/meet-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'suite-e2e-meet' }}
    name: E2E Tests
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"

      - name: Setup Yarn
        # Frappe and the e2e package use Yarn 1. Frappe builds Suite with pnpm.
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Add to Hosts
        run: echo "127.0.0.1 meet.test" | sudo tee -a /etc/hosts

      - name: Set up Pilot
        run: bash .github/scripts/setup-pilot-e2e.sh

      - name: Configure Site for E2E
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site meet.test --admin-password admin --apps frappe suite --skip-assets
          pilot frappe --site meet.test set-config sfu_secret "e2e-test-secret-key-12345"
          pilot frappe --site meet.test set-config sfu_server_url "http://localhost"
          pilot frappe --site meet.test set-config sfu_server_port "3000"
          pilot frappe --site meet.test set-config ignore_csrf 1
          pilot frappe --site meet.test set-config allow_tests true
          pilot frappe --site meet.test set-config host_name "http://meet.test:8000"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pilot frappe set-config -g scheduler_tick_interval 5
            pilot frappe --site meet.test enable-scheduler
            pilot frappe --site meet.test execute suite.tests.ci_smoke.enable_scheduler_smoke_logging
          else
            pilot frappe --site meet.test disable-scheduler
          fi
          pilot frappe --site meet.test clear-cache

      - name: Build SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Install E2E Dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          google-chrome --version

      - name: Install Playwright system dependencies
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}/e2e
        run: yarn playwright install-deps chromium

      - name: Wait for the test site
        id: start-frappe
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            http://meet.test:8000/api/method/ping

      - name: Start SFU Server
        working-directory: ${{ github.workspace }}/suite/meet/sfu-server
        run: |
          yarn start &
          echo "Waiting for SFU server..."
          timeout 30 bash -c 'until curl -s http://localhost:3000/health > /dev/null 2>&1; do sleep 2; done'
          echo "SFU server is ready"
        env:
          NODE_ENV: development
          PORT: 3000
          HOST: 0.0.0.0
          JWT_SECRET: e2e-test-secret-key-12345
          WEBRTC_LISTEN_IP: 0.0.0.0
          WEBRTC_ANNOUNCED_IP: ""
          MEDIASOUP_NUM_WORKERS: 1
          SOCKET_PING_INTERVAL: 1000
          SOCKET_PING_TIMEOUT: 3000

      - name: Run E2E Tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:meet
        env:
          BASE_URL: http://meet.test:8000
          SFU_URL: http://localhost:3000
          CI: true
          SFU_E2E_DISCONNECT_TEST: true
          SFU_E2E_DISCONNECT_WAIT_MS: 7000

      - name: Check Scheduled Job Execution
        if: always() && github.event_name == 'schedule' && steps.start-frappe.outcome == 'success'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: timeout 90 bash -c 'until [ "$(pilot frappe --site meet.test execute suite.tests.ci_smoke.scheduler_smoke_ran)" = "true" ]; do sleep 5; done'

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && !cancelled()
        with:
          name: meet-playwright-report
          path: |
            e2e/meet/playwright-report/
            e2e/meet/test-results/
            e2e/meet/results.xml
            ${{ runner.temp }}/pilot.log
          compression-level: 1
          retention-days: 14

      - name: Upload JUnit Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: meet-junit
          path: e2e/meet/results.xml
          if-no-files-found: warn
          retention-days: 14
