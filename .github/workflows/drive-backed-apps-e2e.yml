name: Drive-Backed Apps E2E Tests

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/drive/**"
      - "suite/writer/**"
      - "suite/slides/**"
      - "e2e/drive-backed-apps/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/drive/**"
      - "frontend/src/apps/writer/**"
      - "frontend/src/apps/slides/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/vite.config.ts"
      - "suite/hooks.py"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "knip.json"
      - ".github/workflows/drive-backed-apps-e2e.yml"
  pull_request:
    paths:
      - "suite/drive/**"
      - "suite/writer/**"
      - "suite/slides/**"
      - "e2e/drive-backed-apps/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/drive/**"
      - "frontend/src/apps/writer/**"
      - "frontend/src/apps/slides/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/vite.config.ts"
      - "suite/hooks.py"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "knip.json"
      - ".github/workflows/drive-backed-apps-e2e.yml"
  workflow_dispatch:

concurrency:
  group: drive-backed-apps-e2e-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Add to hosts
        run: echo "127.0.0.1 drive-writer.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache bench directory
        id: cache-bench
        uses: actions/cache@v4
        with:
          path: ~/frappe-bench
          key: ${{ runner.os }}-bench-${{ hashFiles('**/pyproject.toml', '**/yarn.lock', '**/requirements.txt', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Install MariaDB client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Setup Bench
        run: |
          pip install frappe-bench
          if [ "${{ steps.cache-bench.outputs.cache-hit }}" != "true" ]; then
            bench init --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          fi

      - name: Install Suite
        working-directory: /home/runner/frappe-bench
        run: |
          rm -rf apps/suite sites/drive-writer.test sites/assets/suite
          bench get-app suite "$GITHUB_WORKSPACE"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site --db-root-password root --admin-password admin drive-writer.test
          bench --site drive-writer.test install-app suite
          yarn --cwd apps/suite install --frozen-lockfile --non-interactive
          yarn --cwd apps/suite build
          bench build
        env:
          CI: "Yes"

      - name: Configure site for E2E
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site drive-writer.test set-config allow_tests true
          bench --site drive-writer.test set-config ignore_csrf 1
          bench --site drive-writer.test set-config host_name "http://drive-writer.test:8000"

      - name: Install E2E dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          yarn playwright install-deps chromium
          google-chrome --version

      - name: Start Frappe server
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          sed -i 's/^schedule:/# schedule:/g' Procfile
          bench start &> bench_start.log &
          timeout 60 bash -c 'until curl -s http://drive-writer.test:8000 > /dev/null; do sleep 2; done'

      - name: Run E2E tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:drive-backed-apps --workers=2
        env:
          BASE_URL: http://drive-writer.test:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: drive-backed-apps-playwright-report
          path: |
            e2e/drive-backed-apps/playwright-report/
            e2e/drive-backed-apps/test-results/
            e2e/drive-backed-apps/results.xml
            /home/runner/frappe-bench/bench_start.log
          compression-level: 1
          retention-days: 7
