name: Drive-Backed Apps E2E Tests

on:
  schedule:
    - cron: "37 1 * * *"
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/drive/**"
      - "suite/writer/**"
      - "suite/slides/**"
      - "suite/sheets/**"
      - "suite/public/drive/**"
      - "suite/public/slides/**"
      - "suite/api/**"
      - "suite/suite_core/**"
      - "suite/utils/**"
      - "suite/www/suite.py"
      - "e2e/drive-backed-apps/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/drive/**"
      - "frontend/src/apps/writer/**"
      - "frontend/src/apps/sheets/**"
      - "frontend/src/apps/slides/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/src/shell/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/apps/registry.ts"
      - "frontend/index.html"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "knip.json"
      - ".github/workflows/drive-backed-apps-e2e.yml"
  pull_request_target:
    paths:
      - "suite/drive/**"
      - "suite/writer/**"
      - "suite/slides/**"
      - "suite/sheets/**"
      - "suite/public/drive/**"
      - "suite/public/slides/**"
      - "suite/api/**"
      - "suite/suite_core/**"
      - "suite/utils/**"
      - "suite/www/suite.py"
      - "e2e/drive-backed-apps/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/apps/drive/**"
      - "frontend/src/apps/writer/**"
      - "frontend/src/apps/sheets/**"
      - "frontend/src/apps/slides/**"
      - "frontend/src/boot/**"
      - "frontend/src/router/**"
      - "frontend/src/shell/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/main.ts"
      - "frontend/src/App.vue"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/apps/registry.ts"
      - "frontend/index.html"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "knip.json"
      - ".github/workflows/drive-backed-apps-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'suite-e2e-drive' }}
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.7"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.12.0"

      - name: Setup Yarn
        # Frappe and the e2e package use Yarn 1. Frappe builds Suite with pnpm.
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Add to hosts
        run: echo "127.0.0.1 drive-writer.test" | sudo tee -a /etc/hosts

      - name: Set up Pilot
        run: bash .github/scripts/setup-pilot-e2e.sh

      - name: Configure site for E2E
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site drive-writer.test --admin-password admin --apps frappe suite --skip-assets
          pilot frappe --site drive-writer.test set-config allow_tests true
          pilot frappe --site drive-writer.test set-config storage_v2 1
          pilot frappe --site drive-writer.test set-config ignore_csrf 1
          pilot frappe --site drive-writer.test set-config host_name "http://drive-writer.test:8000"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            pilot frappe set-config -g scheduler_tick_interval 5
            pilot frappe --site drive-writer.test enable-scheduler
            pilot frappe --site drive-writer.test execute suite.tests.ci_smoke.enable_scheduler_smoke_logging
          else
            pilot frappe --site drive-writer.test disable-scheduler
          fi

      - name: Install E2E dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          google-chrome --version

      - name: Install Playwright system dependencies
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}/e2e
        run: yarn playwright install-deps chromium

      - name: Wait for the test site
        id: start-frappe
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 \
            http://drive-writer.test:8000/api/method/ping

      - name: Run E2E tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:drive-backed-apps --workers=2
        env:
          BASE_URL: http://drive-writer.test:8000
          CI: true

      - name: Check scheduled job execution
        if: always() && github.event_name == 'schedule' && steps.start-frappe.outcome == 'success'
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: timeout 90 bash -c 'until [ "$(pilot frappe --site drive-writer.test execute suite.tests.ci_smoke.scheduler_smoke_ran)" = "true" ]; do sleep 5; done'

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: drive-backed-apps-playwright-report
          path: |
            e2e/drive-backed-apps/playwright-report/
            e2e/drive-backed-apps/test-results/
            e2e/drive-backed-apps/results.xml
            ${{ runner.temp }}/pilot.log
          compression-level: 1
          retention-days: 30

      - name: Upload JUnit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: drive-backed-apps-junit
          path: e2e/drive-backed-apps/results.xml
          if-no-files-found: warn
          retention-days: 30
