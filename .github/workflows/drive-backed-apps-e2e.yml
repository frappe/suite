name: Drive-Backed Apps E2E Tests

on:
  schedule:
    - cron: "37 1 * * *"
  push:
    branches:
      - develop
      - main
    paths:
      - "suite/drive/**"
      - "suite/writer/**"
      - "suite/slides/**"
      - "e2e/drive-backed-apps/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "knip.json"
      - ".github/workflows/drive-backed-apps-e2e.yml"
  pull_request_target:
    paths:
      - "suite/drive/**"
      - "suite/writer/**"
      - "suite/slides/**"
      - "e2e/drive-backed-apps/**"
      - "e2e/shared/**"
      - "e2e/package.json"
      - "e2e/yarn.lock"
      - "e2e/tsconfig.json"
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/vite.config.ts"
      - "suite/hooks.py"
      - "suite/tests/ci_smoke.py"
      - "package.json"
      - "yarn.lock"
      - "pyproject.toml"
      - "knip.json"
      - ".github/workflows/drive-backed-apps-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: suite-e2e
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true

      - name: Setup Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Add to hosts
        run: echo "127.0.0.1 drive-writer.test" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Setup Bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" "$RUNNER_TEMP/frappe-bench"

      - name: Install Suite
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          rm -rf apps/suite sites/drive-writer.test sites/assets/suite
          bench get-app suite "$GITHUB_WORKSPACE"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
          bench new-site --db-root-password root --admin-password admin drive-writer.test
          bench --site drive-writer.test install-app suite
          yarn --cwd apps/suite install --frozen-lockfile --non-interactive
          yarn --cwd apps/suite build
          bench build
        env:
          CI: "Yes"

      - name: Configure site for E2E
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          bench --site drive-writer.test set-config allow_tests true
          bench --site drive-writer.test set-config ignore_csrf 1
          bench --site drive-writer.test set-config host_name "http://drive-writer.test:8000"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bench set-config -g scheduler_tick_interval 5
            bench --site drive-writer.test enable-scheduler
            bench --site drive-writer.test execute suite.tests.ci_smoke.enable_scheduler_smoke_logging
          fi

      - name: Install E2E dependencies
        working-directory: ${{ github.workspace }}/e2e
        timeout-minutes: 20
        run: |
          yarn install --frozen-lockfile --non-interactive
          google-chrome --version

      - name: Start Frappe server
        id: start-frappe
        working-directory: ${{ runner.temp }}/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          if [ "${{ github.event_name }}" != "schedule" ]; then
            sed -i 's/^schedule:/# schedule:/g' Procfile
          fi
          bench start &> bench_start.log &
          timeout 60 bash -c 'until curl -s http://drive-writer.test:8000 > /dev/null; do sleep 2; done'

      - name: Run E2E tests
        working-directory: ${{ github.workspace }}/e2e
        run: yarn test:drive-backed-apps --workers=2
        env:
          BASE_URL: http://drive-writer.test:8000
          CI: true

      - name: Check scheduled job execution
        if: always() && github.event_name == 'schedule' && steps.start-frappe.outcome == 'success'
        working-directory: ${{ runner.temp }}/frappe-bench
        run: timeout 90 bash -c 'until [ "$(bench --site drive-writer.test execute suite.tests.ci_smoke.scheduler_smoke_ran)" = "true" ]; do sleep 5; done'

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: drive-backed-apps-playwright-report
          path: |
            e2e/drive-backed-apps/playwright-report/
            e2e/drive-backed-apps/test-results/
            e2e/drive-backed-apps/results.xml
            ${{ runner.temp }}/frappe-bench/bench_start.log
          compression-level: 1
          retention-days: 30

      - name: Upload JUnit results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: drive-backed-apps-junit
          path: e2e/drive-backed-apps/results.xml
          if-no-files-found: warn
          retention-days: 30
