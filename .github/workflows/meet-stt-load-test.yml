name: Test Meet STT Load Harness

on:
  pull_request:
    paths:
      - "suite/meet/sfu-server/stt-server/load/**"
      - ".github/workflows/meet-stt-load-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test load harness
        working-directory: suite/meet/sfu-server/stt-server
        run: |
          python -m pip install websockets==17.1
          python -m unittest discover -s load -p '*_test.py'
