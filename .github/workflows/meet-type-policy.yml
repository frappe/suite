name: Meet Type Policy

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/src/apps/meet/**"
      - "frontend/recorder/**"
      - "suite/meet/types/**"
      - "suite/meet/sfu-server/src/**"
      - "suite/meet/recorder-server/src/**"
      - "suite/meet/type-policy/**"
      - "e2e/meet/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/meet-type-policy.yml"
  pull_request:
    paths:
      - "frontend/src/apps/meet/**"
      - "frontend/recorder/**"
      - "suite/meet/types/**"
      - "suite/meet/sfu-server/src/**"
      - "suite/meet/recorder-server/src/**"
      - "suite/meet/type-policy/**"
      - "e2e/meet/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/meet-type-policy.yml"
  workflow_dispatch:

concurrency:
  group: meet-type-policy-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Test policy
        run: yarn test:meet-type-policy

      - name: Check Meet types
        run: yarn check:meet-types
