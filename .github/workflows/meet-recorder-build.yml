name: Build and Push Meet Recorder Image

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/recorder/**"
      - "frontend/recorder.html"
      - "frontend/src/apps/meet/**"
      - "frontend/src/apps/slides/utils/serviceWorker.ts"
      - "frontend/src/apps/slides/utils/slidesCaches.ts"
      - "frontend/src/boot/**"
      - "frontend/src/components/**"
      - "frontend/src/composables/**"
      - "frontend/src/utils/**"
      - "frontend/src/stores/**"
      - "frontend/src/assets/**"
      - "frontend/src/shims/**"
      - "frontend/src/index.css"
      - "frontend/src/env.d.ts"
      - "frontend/src/test/icon-stub.ts"
      - "frontend/tailwind.config.js"
      - "frontend/postcss.config.js"
      - "frontend/tsconfig.json"
      - "frontend/tsconfig.node.json"
      - "frontend/package.json"
      - "frontend/vite.recorder.config.ts"
      - "suite/meet/recorder-server/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/meet-recorder-build.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: frappe/suite/meet-recorder-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: suite/meet/recorder-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
