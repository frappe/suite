exclude: "node_modules|.git"
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "suite/.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        args: ["--fix"]
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: local
    hooks:
      - id: prettier-frontend
        name: Prettier (frontend)
        entry: node_modules/.bin/prettier --write
        language: system
        files: ^(frontend/.*|scripts/.*|baselines/.*|[^/]+)\.(js|mjs|cjs|ts|mts|tsx|vue|css|json|html)$
        exclude: |
          (?x)^(
              frontend/src/.*/contract\.json|
              frontend/src/.*/generated\.ts|
              frontend/auto-imports\.d\.ts|
              frontend/components\.d\.ts|
              frontend/public/.*|
              knip\.json
          )$

      - id: oxlint-frontend
        name: oxlint + anti-slop (JS/TS)
        entry: node_modules/.bin/oxlint --quiet
        language: system
        types_or: [javascript, jsx, ts, tsx, vue]
        files: \.(js|mjs|cjs|jsx|ts|mts|cts|tsx|vue)$
        exclude: ^(frontend/src/.*/generated\.ts|tools/oxlint/anti-slop/.*|frappe-ui/.*|frontend/public/.*|frontend/packages/collab-prosemirror/.*|frontend/(auto-imports|components)\.d\.ts)$

      # A policy change must be checked against the whole tree, even when no
      # frontend source file is staged.
      - id: oxlint-policy
        name: oxlint + anti-slop (policy changes)
        entry: node_modules/.bin/oxlint --quiet .
        language: system
        pass_filenames: false
        files: ^(tools/oxlint/.*|\.oxlintrc\.json|package\.json|pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

      - id: anti-slop-integration
        name: Anti-slop integration
        entry: node --test tools/oxlint/anti-slop.test.mjs
        language: system
        pass_filenames: false
        files: ^(tools/oxlint/.*|\.oxlintrc\.json|package\.json|pnpm-lock\.yaml|\.pre-commit-config\.yaml)$

      # Staged files only: autofixes are applied, and the baseline comparison
      # is limited to these files. CI runs the whole tree.
      - id: eslint-frontend
        name: ESLint (frontend)
        entry: node scripts/lint.mjs --fix
        language: system
        files: ^(frontend/.*|scripts/.*|[^/]+)\.(js|mjs|cjs|ts|mts|tsx|vue)$
        exclude: |
          (?x)^frontend/(
              src/.*/generated\.ts|
              auto-imports\.d\.ts|
              components\.d\.ts|
              public/.*
          )$

      - id: knip-e2e
        name: Knip (E2E)
        entry: pnpm knip:e2e
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              e2e/.*|
              knip\.json|
              package\.json|
              pnpm-lock\.yaml
          )$

      - id: knip-sfu-server
        name: Knip (SFU Server)
        entry: pnpm knip:sfu-server
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              suite/meet/sfu-server/.*|
              knip\.json|
              package\.json|
              pnpm-lock\.yaml
          )$

      - id: biome-sfu-server
        name: Biome Check (SFU Server)
        entry: bash -c 'cd suite/meet/sfu-server && node_modules/.bin/biome check --write --config-path biome.json "${@/#suite\/meet\/sfu-server\//}"' --
        language: system
        files: "suite/meet/sfu-server/.*\\.(js|ts|json)$"
        exclude: |
          (?x)^(
              .*node_modules.*|
              suite/meet/sfu-server/dist/.*|
              suite/meet/sfu-server/tsconfig\.json
          )$

      - id: meet-type-policy
        name: Meet Type Policy
        entry: pnpm check:meet-types
        language: system
        pass_filenames: false
        files: |
          (?x)^(
              frontend/src/apps/meet/.*\.(ts|tsx|vue)|
              frontend/recorder/.*\.(ts|tsx|vue)|
              suite/meet/(types|sfu-server/src|recorder-server/src)/.*\.(ts|tsx)|
              suite/meet/type-policy/.*|
              e2e/meet/.*\.(ts|tsx)|
              package\.json|
              pnpm-lock\.yaml
          )$

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
