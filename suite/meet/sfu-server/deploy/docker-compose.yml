# ==============================================================================
# Frappe Meet SFU — Docker Compose Stack
# ==============================================================================
# Services:
#   sfu     – Mediasoup SFU server (signaling on port 3000, fixed UDP media ports)
#   recorder – Browser-based recording service (control on host loopback only)
#   nginx   – Reverse proxy (SSL termination + WebSocket upgrade)
#   certbot – Let's Encrypt certificate provisioning & renewal
#
# Usage:
#   docker compose up -d        # start everything
#   docker compose logs -f sfu  # tail SFU logs
#   docker compose down         # stop everything
#
# See deploy.sh for the recommended workflow.
# ==============================================================================

services:
  grant-store-init:
    image: ${SFU_IMAGE:-ghcr.io/frappe/suite/meet-sfu-server:latest}
    container_name: suite-sfu-grant-store-init
    restart: "no"
    volumes:
      - sfu-grants:/data
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import { RecordingGrantPersistenceFile } from
        './dist/sfu-server/src/server/RecordingGrantPersistenceFile.js';
        await RecordingGrantPersistenceFile.bootstrap('/data/recording-grants.json');

  # ── SFU Server ──────────────────────────────────────────────────────────────
  sfu:
    image: ${SFU_IMAGE:-ghcr.io/frappe/suite/meet-sfu-server:latest}
    container_name: suite-sfu
    restart: unless-stopped
    depends_on:
      grant-store-init:
        condition: service_completed_successfully
    network_mode: host
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - PORT=${PORT:-3000}
      - HOST=${HOST:-127.0.0.1}
      - SOCKET_PING_TIMEOUT=${SOCKET_PING_TIMEOUT:-60000}
      - SOCKET_PING_INTERVAL=${SOCKET_PING_INTERVAL:-25000}
      - WEBRTC_LISTEN_IP=${WEBRTC_LISTEN_IP:-}
      - WEBRTC_ANNOUNCED_IP=${WEBRTC_ANNOUNCED_IP:?WEBRTC_ANNOUNCED_IP is required}
      - WEBRTC_SERVER_PORT=${WEBRTC_SERVER_PORT:-40000}
      - MEDIASOUP_NUM_WORKERS=${MEDIASOUP_NUM_WORKERS:-}
      - MEDIASOUP_WORKER_LOGLEVEL=${MEDIASOUP_WORKER_LOGLEVEL:-warn}
      - SFU_LOG_LEVEL=${SFU_LOG_LEVEL:-info}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
      - RECORDING_GRANT_PERSISTENCE_FILE=/data/recording-grants.json
      - NODE_ENV=production
    volumes:
      - sfu-grants:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  recorder:
    image: ${RECORDER_IMAGE:-ghcr.io/frappe/suite/meet-recorder-server:latest}
    container_name: suite-recorder
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${RECORDER_PORT:-3010}:3010"
    volumes:
      - recorder-data:/data
    environment:
      - PORT=3010
      - RECORDER_SECRET=${RECORDER_SECRET}
      - RECORDER_METRICS_TOKEN=${RECORDER_METRICS_TOKEN}
      - RECORDER_SITE=${RECORDER_SITE}
      - RECORDER_SITE_ORIGIN=${RECORDER_SITE_ORIGIN}
      - RECORDER_ALLOW_HTTP=${RECORDER_ALLOW_HTTP:-false}
      - RECORDER_MAX_CONCURRENT=1
      - RECORDER_MIN_FREE_BYTES=${RECORDER_MIN_FREE_BYTES:-1073741824}
      - SFU_ORIGIN=https://${DOMAIN}
      - SFU_SOCKET_PATH=/socket.io
      - RECORDER_CHROMIUM_NO_SANDBOX=true
    cpus: ${RECORDER_CPUS:-4}
    mem_limit: ${RECORDER_MEMORY:-6g}
    pids_limit: ${RECORDER_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: suite-sfu-nginx
    restart: unless-stopped
    # host networking: nginx binds directly to host ports 80/443.
    # No 'ports:' mapping needed (or allowed) with network_mode: host.
    network_mode: host
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN}
      - SFU_UPSTREAM=127.0.0.1:${PORT:-3000}
      - RECORDER_UPSTREAM=127.0.0.1:${RECORDER_PORT:-3010}
    # nginx:alpine uses envsubst automatically on /etc/nginx/templates/*.template
    # Note: deploy.sh handles startup order (SFU first, then nginx)
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Certbot (SSL certificates) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: suite-sfu-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Renew certificates every 12 hours (certbot is idempotent)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 43200 & wait $${!}; done"
    profiles:
      - ssl
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  alloy:
    image: grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    restart: unless-stopped
    profiles:
      - observability
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/sfu.alloy
    environment:
      - ALLOY_ENVIRONMENT=${ALLOY_ENVIRONMENT:-production}
      - ALLOY_HOST=${ALLOY_HOST:-}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-}
      - LOKI_PUSH_USER=${LOKI_PUSH_USER:-alloy}
    volumes:
      - ./alloy/sfu.alloy:/etc/alloy/sfu.alloy:ro
      - ./secrets/loki-password:/run/secrets/loki-password:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  alloy-data:
  sfu-grants:
  recorder-data:
  certbot-webroot:
  certbot-certs:
