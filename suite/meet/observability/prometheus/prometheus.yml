global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: frappe-meet-sfu
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/sfu_metrics_token
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s
