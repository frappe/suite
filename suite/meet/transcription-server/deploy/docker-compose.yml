services:
  transcription:
    build:
      context: ../..
      dockerfile: transcription-server/Dockerfile
    restart: unless-stopped
    gpus: all
    cpus: ${TRANSCRIPTION_CPUS:-2}
    mem_limit: ${TRANSCRIPTION_MEMORY:-8g}
    memswap_limit: ${TRANSCRIPTION_MEMORY:-8g}
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    environment:
      TRANSCRIPTION_SITES_FILE: /run/secrets/sites.json
      TRANSCRIPTION_METRICS_TOKEN_FILE: /run/secrets/metrics-token
      TRANSCRIPTION_ALLOCATOR_GIB: ${TRANSCRIPTION_ALLOCATOR_GIB:-7}
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - ${TRANSCRIPTION_CACHE_DIR:-./cache}:/models
      - ./secrets/sites.json:/run/secrets/sites.json:ro
      - ./secrets/metrics-token:/run/secrets/metrics-token:ro
    tmpfs:
      - /tmp:size=256m,mode=1777

  proxy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      TRANSCRIPTION_DOMAIN: ${TRANSCRIPTION_DOMAIN:?Set a dedicated worker hostname}
      TLS_EMAIL: ${TLS_EMAIL:?Set the TLS certificate email}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - transcription

volumes:
  caddy-data:
  caddy-config:
