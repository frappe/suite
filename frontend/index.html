<!doctype html>
<html
  lang="en"
  data-theme-mode="{{ desk_theme.lower() if desk_theme else 'light' }}"
  data-theme="{{ desk_theme.lower() if desk_theme else 'light' }}"
>
  <head>
    <script>
      if (document.documentElement.dataset.theme === 'automatic') {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
      }
    </script>
    <meta charset="UTF-8" />
    <title>Frappe Suite</title>
    <link rel="icon" type="image/svg+xml" href="/src/platform/brand/suite.svg" />
    <!-- viewport-fit=cover: draw edge-to-edge in iOS standalone — required for the
         env(safe-area-inset-*) paddings to be non-zero at all.

         interactive-widget=resizes-content: the on-screen keyboard shrinks the layout viewport
         instead of leaving it full-height and sliding the visible part around underneath. Without
         it a full-screen pane runs on under the keyboard, and iOS pans the whole page to reveal a
         focused field — the compose sheet jumping on every focus change. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script>
      // The boot mark is Mail's on Mail's pages at phone width (Mail's isMobile, under 640px),
      // the Suite's everywhere else. After the viewport meta: before it, a phone reports a
      // desktop-wide layout.
      var path = location.pathname
      if ((path === '/mail' || path.startsWith('/mail/')) && innerWidth < 640)
        document.documentElement.dataset.bootApp = 'mail'
    </script>
    <!-- Status-bar/browser-chrome color; kept in sync with the active scheme at
         runtime (see mail's MailLayout) so the bar never sits white over a dark app. -->
    <meta
      name="theme-color"
      content="{{ '#171717' if desk_theme and desk_theme.lower() == 'dark' else '#ffffff' }}"
    />
    <!-- The manifest and standalone metas are not here: the platform attaches
         them at boot, on every route (see src/platform/pwa setPwaTags). -->
    <!-- The boot placeholder below is plain CSS: the app's styles load with it.
         Dark follows data-theme, or the system when the theme is not set. -->
    <style>
      .suite-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
      }
      .suite-boot svg {
        width: 32px;
        height: 32px;
        opacity: 0;
        animation:
          suite-boot-in 240ms ease-out 400ms forwards,
          suite-boot-pulse 1.6s ease-in-out 640ms infinite;
      }
      .suite-boot .suite-boot-mail,
      :root[data-boot-app='mail'] .suite-boot .suite-boot-suite {
        display: none;
      }
      /* Mail's mark matches its iOS launch screen, which shows first: 30% of the screen's
         short side (scripts/generate-pwa-assets.mjs), less mail.svg's 1-unit margin. It is
         there from the start, so the launch screen hands over without a blink. */
      :root[data-boot-app='mail'] .suite-boot .suite-boot-mail {
        display: block;
        width: 29.7vmin;
        height: 29.7vmin;
        opacity: 1;
        animation: suite-boot-pulse 1.6s ease-in-out 640ms infinite;
      }
      :root[data-theme='dark'] .suite-boot {
        background: #171717;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .suite-boot {
          background: #171717;
        }
      }
      @keyframes suite-boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes suite-boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .suite-boot svg {
          animation: suite-boot-in 0s linear 400ms forwards;
        }
        :root[data-boot-app='mail'] .suite-boot .suite-boot-mail {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="h-screen">
      <!-- Shown until the app mounts, which replaces it. The mark fades in only
           when loading takes longer than 400 ms. -->
      <div class="suite-boot" role="status" aria-label="Loading Frappe Suite">
        <svg class="suite-boot-suite" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <path
            d="M0 14.4C0 9.35953 0 6.83929 0.980941 4.91409C1.8438 3.22063 3.22063 1.8438 4.91409 0.980941C6.83929 0 9.35953 0 14.4 0H21.6C26.6405 0 29.1607 0 31.0859 0.980941C32.7794 1.8438 34.1562 3.22063 35.0191 4.91409C36 6.83929 36 9.35953 36 14.4V21.6C36 26.6405 36 29.1607 35.0191 31.0859C34.1562 32.7794 32.7794 34.1562 31.0859 35.0191C29.1607 36 26.6405 36 21.6 36H14.4C9.35953 36 6.83929 36 4.91409 35.0191C3.22063 34.1562 1.8438 32.7794 0.980941 31.0859C0 29.1607 0 26.6405 0 21.6V14.4Z"
            fill="black"
          />
          <path
            d="M22.4999 10.9286H26.3571C27.4222 10.9286 28.2857 11.792 28.2857 12.8571V24.4286C28.2857 25.4937 27.4222 26.3571 26.3571 26.3571H9.64281C8.57769 26.3571 7.71423 25.4937 7.71423 24.4286V16.8424H10.2857V23.7857H25.7142V13.5H7.71423V10.9286H13.4999V9H22.4999V10.9286ZM21.2142 19.415H14.7857V16.8436H21.2142V19.415Z"
            fill="white"
          />
        </svg>
        <svg class="suite-boot-mail" viewBox="0.838 0.691 100 100" fill="none" aria-hidden="true">
          <path
            d="M29.4096 100.691L72.2667 100.691C88.0463 100.691 100.838 87.8991 100.838 72.1195L100.838 29.2623C100.838 13.4828 88.0463 0.690918 72.2667 0.690918L29.4096 0.690918C13.63 0.690918 0.838135 13.4828 0.838135 29.2623L0.838135 72.1195C0.838135 87.8991 13.63 100.691 29.4096 100.691Z"
            fill="#0466DC"
          />
          <path
            d="M22.2664 29.2622V34.5479L29.4092 40.3693L43.0521 51.4765C45.2306 53.2622 48.0164 54.2622 50.8378 54.2622C53.6592 54.2622 56.4449 53.2622 58.6235 51.4765L72.2664 40.3336V64.9408H29.4092V49.6194L22.2664 43.7979V63.1551C22.2664 68.0836 26.2664 72.0836 31.1949 72.0836H70.4807C75.4092 72.0836 79.4092 68.0836 79.4092 63.1551V29.2622H22.2664ZM54.1235 45.9408C52.2664 47.4408 49.4092 47.4408 47.5878 45.9408L35.8735 36.4051H65.8378L54.1235 45.9408Z"
            fill="white"
          />
        </svg>
      </div>
    </div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = '{{ csrf_token }}'
    </script>
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
