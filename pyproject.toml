[project]
name = "suite"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io" },
]
description = "Frappe Suite — Drive, Slides, Writer, Sheets, Meet, Mail, Calendar in one app."
readme = "README.md"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    # drive
    "av>=12.0.0",
    "mimemapper==0.4.1",
    "pymupdf>=1.24.0",
    "boto3~=1.43.29",
    "pycrdt==0.14.8",
    "lxml~=6.1",  # drive: WebDAV XML (previously only a transitive dep via frappe)
    # kept for other suite modules (drive dropped these): PyJWT→meet, Markdown→writer, beautifulsoup4→mail/client
    "PyJWT>=2.8.0",
    "Markdown==3.8.2",
    "beautifulsoup4>=4.13.5,<5",
    # mail
    "lmdb~=1.7.1",
    "wrapt~=1.17.3",
    "msgpack~=1.2.1",
    "isodate~=0.7.2",
    "tantivy~=0.26.0",
    "icalendar~=6.1.0",
    "pydenticon~=0.3.1",
    "jmaplib[push]~=3.0.1",
    # sheets
    "openpyxl~=3.1.5",  # sheets: xlsx import (previously only a transitive dep via frappe)
    # sheets — AI Assist (Claude)
    "anthropic>=0.40",
]

[deploy.dependencies.apt]
packages = [
    "ffmpeg",   # drive: video thumbnails/transcode
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# mypy checks the packages written to STANDARDS.md. Run `mypy` from this
# directory inside a bench; `python_executable` points at the bench env so
# frappe and the app's dependencies resolve. Tests and patches are excluded as
# frappe does. Every module not listed under `ignore_errors` must stay clean.
[tool.mypy]
files = ["suite/drive", "suite/composition", "suite/suite_core/content", "suite/writer/collab"]
python_executable = "../../env/bin/python"
exclude = ['/tests/', '/patches/', '/test_[^/]+\.py$', 'benchmark_']
ignore_missing_imports = true
pretty = true

# Target: an empty list. Remove a module when `mypy` reports nothing for it;
# a module gains no entry here. Owner: Drive.
[[tool.mypy.overrides]]
module = [
    "suite.composition.redirects",
    "suite.drive._core.access",
    "suite.drive._core.activity",
    "suite.drive._core.content",
    "suite.drive._core.nodes",
    "suite.drive._core.quota",
    "suite.drive._core.roots",
    "suite.drive._core.upload",
    "suite.drive._core.versions",
    "suite.drive.doctype.drive_node.drive_node",
    "suite.drive.http.routes",
    "suite.drive.http.shapes",
    "suite.drive.webdav.copy",
    "suite.drive.webdav.get",
    "suite.drive.webdav.lock",
    "suite.drive.webdav.propfind",
    "suite.drive.webdav.proppatch",
    "suite.drive.webdav.put",
    "suite.drive.webdav.structure",
]
ignore_errors = true
